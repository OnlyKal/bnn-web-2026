<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Icônes Connexion - Noir</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-connexion {
            background-color: white;
            border: 2px solid #0284c7;
            display: flex;
            align-items: center;
            border-radius: 7px;
            margin: 15px 0;
        }
        .icon-connexion {
            color: #000000 !important;
            padding: 10px 15px;
            font-size: 18px;
        }
        .input-connexion .icon-connexion,
        .input-connexion svg.icon-connexion {
            color: #000000 !important;
            fill: #000000 !important;
        }
        input {
            border: none;
            outline: none;
            flex: 1;
            padding: 10px;
            font-size: 16px;
            background: transparent;
        }
        h1 { color: #333; text-align: center; }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .note { 
            background: #e7f3ff; 
            color: #0066cc; 
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Test Icônes Connexion</h1>
        
        <div class="status success">
            ✅ Couleur: NOIR (#000000) avec !important
        </div>
        
        <div class="status note">
            📱 Application disponible sur: http://localhost:5175/
        </div>
        
        <div class="input-connexion">
            <span class="icon-connexion">👤</span>
            <input type="text" placeholder="Nom d'utilisateur" />
        </div>
        
        <div class="input-connexion">
            <span class="icon-connexion">🔒</span>
            <input type="password" placeholder="Mot de passe" />
        </div>
        
        <div class="input-connexion">
            <span class="icon-connexion">✉️</span>
            <input type="email" placeholder="Email (Reset Password)" />
        </div>
        
        <div class="status note">
            Les vraies icônes React sont en noir dans l'app !
        </div>
    </div>
</body>
</html>
